<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 | 永芳旅行社</title>
    <!-- 引入 Google Fonts 與 Tailwind CSS 加速排版與質感呈現 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- 導覽列 (模擬 index/about/contact 架構) -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-wider text-slate-900 flex items-center gap-2">
                ✈️ 永芳旅行社 <span class="text-xs font-normal text-slate-500 uppercase tracking-widest hidden sm:inline">Yongfang Travel</span>
            </a>
            <nav class="flex items-center gap-8 text-sm font-medium">
                <a href="index.html" class="text-slate-600 hover:text-slate-900 transition">首頁</a>
                <a href="about.html" class="text-slate-600 hover:text-slate-900 transition">關於我們</a>
                <a href="contact.html" class="text-sky-600 font-semibold transition">聯絡我們</a>
            </nav>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 md:py-20 w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
        
        <!-- 左側：品牌資訊與說明 -->
        <div class="lg:col-span-5 space-y-8">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-sky-600 bg-sky-50 px-3 py-1 rounded-full">Get in Touch</span>
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mt-4 tracking-tight">開啟您的下一趟夢幻旅程</h1>
                <p class="text-slate-600 mt-3 leading-relaxed text-sm md:text-base">
                    無論是客製化行程規劃、團體旅遊諮詢，或是任何旅遊相關疑問，歡迎隨時與我們聯繫。我們的專業團隊將盡快為您解答。
                </p>
            </div>

            <div class="space-y-6 pt-4 border-t border-slate-200">
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-xl bg-white shadow-sm border border-slate-100 flex items-center justify-center text-sky-600 shrink-0 font-bold">📍</div>
                    <div>
                        <h3 class="font-semibold text-slate-900">公司地址</h3>
                        <p class="text-sm text-slate-600 mt-1">台北市或基隆市旅遊服務據點</p>
                    </div>
                </div>
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-xl bg-white shadow-sm border border-slate-100 flex items-center justify-center text-sky-600 shrink-0 font-bold">📞</div>
                    <div>
                        <h3 class="font-semibold text-slate-900">聯絡電話</h3>
                        <p class="text-sm text-slate-600 mt-1">(02) 2345-6789</p>
                    </div>
                </div>
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-xl bg-white shadow-sm border border-slate-100 flex items-center justify-center text-sky-600 shrink-0 font-bold">✉️</div>
                    <div>
                        <h3 class="font-semibold text-slate-900">電子信箱</h3>
                        <p class="text-sm text-slate-600 mt-1">service@yongfang-travel.com</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：高級感回傳表單 -->
        <div class="lg:col-span-7 bg-white rounded-3xl p-8 md:p-10 shadow-xl shadow-slate-100 border border-slate-100 relative">
            <form id="contactForm" class="space-y-6">
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">您的姓名 / 稱謂</label>
                    <input type="text" name="name" required placeholder="例如：陳小姐" 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">電子郵件</label>
                        <input type="email" name="email" required placeholder="name@example.com" 
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">聯絡電話</label>
                        <input type="tel" name="phone" required placeholder="0912-345-678" 
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">諮詢主旨 / 興趣行程</label>
                    <select name="subject" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition text-sm">
                        <option value="檳城蘭卡威5日遊">【超值嚴選】檳城・蘭卡威 5 天 4 夜夢幻海島之旅</option>
                        <option value="馬爾地夫海島假期">馬爾地夫・幸福海島假期</option>
                        <option value="客製化自組團">其他客製化 / 親友自組團規劃</option>
                        <option value="一般旅遊諮詢">一般旅遊諮詢與其他</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">詳細需求與留言</label>
                    <textarea name="message" rows="4" required placeholder="請告訴我們您的預計出發日期、人數或其他特殊需求..." 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition text-sm"></textarea>
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl transition shadow-lg shadow-slate-200 text-sm tracking-wider uppercase">
                    送出諮詢表單
                </button>

                <!-- 狀態提示訊息 -->
                <div id="formStatus" class="hidden text-center text-sm font-medium py-2 rounded-xl"></div>
            </form>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-100 py-8 text-center text-xs text-slate-400">
        <p>&copy; 2026 永芳旅行社 Yongfang Travel. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript 處理表單非同步傳送至 Google Apps Script -->
    <script>
        // ⚠️ 請將下方引號內的網址替換為您的 Google Apps Script 部署網址 (Web App URL)
        const SCRIPT_URL = "https://script.google.com/macros/s/您的GoogleScript部署ID/exec";

        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const formStatus = document.getElementById('formStatus');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 按鈕進入載入狀態
            submitBtn.disabled = true;
            submitBtn.textContent = '傳送中...';
            formStatus.classList.add('hidden');

            const formData = new FormData(form);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                submitBtn.disabled = false;
                submitBtn.textContent = '送出諮詢表單';
                
                if (data.result === 'success') {
                    formStatus.textContent = '✅ 感謝您的填寫！表單已成功送出，我們將盡快與您聯繫。';
                    formStatus.className = 'text-center text-sm font-medium py-3 bg-emerald-50 text-emerald-700 rounded-xl';
                    form.reset();
                } else {
                    throw new Error('Server error');
                }
            })
            .catch(error => {
                submitBtn.disabled = false;
                submitBtn.textContent = '送出諮詢表單';
                formStatus.textContent = '❌ 傳送失敗，請稍後再試，或直接透過 LINE 與我們聯繫。';
                formStatus.className = 'text-center text-sm font-medium py-3 bg-rose-50 text-rose-700 rounded-xl';
            });
        });
    </script>
</body>
</html>
